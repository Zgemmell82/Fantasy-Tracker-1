<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Football Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa0ab;
    --accent: #4f8cff;
    --green: #34c759;
    --red: #ff5b5b;
    --amber: #ffb84f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar button {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar input[type=file] { display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); align-items: center; }
  .tab {
    padding: 10px 14px; cursor: pointer; font-size: 14px; color: var(--text-dim);
    border-bottom: 2px solid transparent; user-select: none;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .week-select {
    margin-left: auto; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .league-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .league-header .lname { font-size: 16px; font-weight: 600; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 12px 0 6px; }
  .player-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .player-row:last-child { border-bottom: none; }
  .player-name { flex: 1; font-size: 14px; }
  .player-meta { font-size: 12px; color: var(--text-dim); }
  .badge {
    font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap;
  }
  .badge.for { background: rgba(52,199,89,0.15); color: var(--green); }
  .badge.against { background: rgba(255,91,91,0.15); color: var(--red); }
  .add-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .add-row input, .add-row select {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  .add-row input.name { flex: 1; min-width: 100px; }
  .add-row input.team { width: 56px; text-transform: uppercase; }
  .add-row select { width: 66px; }
  .add-row button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .add-row button:hover { opacity: 0.9; }
  .autocomplete-wrap { position: relative; margin-top: 8px; }
  .search-input {
    width: 100%; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .dropdown {
    position: absolute; top: 100%; left: 0; right: 0; background: var(--card2);
    border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; max-height: 220px;
    overflow-y: auto; z-index: 10;
  }
  .dropdown-item {
    padding: 8px 10px; font-size: 13px; cursor: pointer; display: flex;
    justify-content: space-between; gap: 8px; align-items: center;
  }
  .dropdown-item:hover, .dropdown-item.hl { background: rgba(255,255,255,0.06); }
  .dropdown-item .meta { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .manual-toggle {
    font-size: 11px; color: var(--text-dim); cursor: pointer; text-decoration: underline;
    margin-top: 6px; display: inline-block;
  }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 16px 0; }
  .empty.big { padding: 30px 0; font-size: 14px; }
  .rm-x { cursor: pointer; color: var(--text-dim); font-size: 13px; padding: 0 4px; }
  .rm-x:hover { color: var(--red); }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; }
  .save-hint { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 20px; }
  .game-card { margin-bottom: 14px; }
  .game-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .game-time { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .game-cols { display: flex; gap: 14px; }
  .game-col { flex: 1; min-width: 0; }
  .game-col-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .game-col-label.for { color: var(--green); }
  .game-col-label.against { color: var(--red); }
  .cheer-line { font-size: 13px; padding: 3px 0; }
  .cheer-line .league-tag { color: var(--text-dim); font-size: 11px; }
  .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .clear-btn:hover { color: var(--red); border-color: var(--red); }
  .header-btns { display: flex; gap: 6px; }
  .games-toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filter-btn {
    background: var(--card2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  .filter-btn.active { background: rgba(79,140,255,0.15); color: var(--accent); border-color: var(--accent); }
  .summary-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .summary-stat {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; flex: 1; min-width: 90px; text-align: center;
  }
  .summary-stat .num { font-size: 20px; font-weight: 700; }
  .summary-stat .num.green { color: var(--green); }
  .summary-stat .num.red { color: var(--red); }
  .summary-stat .lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 5px; background: rgba(255,91,91,0.15);
    color: var(--red); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    margin-left: 8px; letter-spacing: 0.03em; vertical-align: middle;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse-dot 1.3s infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .final-badge {
    display: inline-block; background: var(--card2); color: var(--text-dim); font-size: 10px;
    font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 8px; letter-spacing: 0.03em;
  }
  .verdict-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 700; margin-left: 8px;
    letter-spacing: 0.02em; vertical-align: middle;
  }
  .verdict-badge.win { background: rgba(52,199,89,0.15); color: var(--green); }
  .verdict-badge.lose { background: rgba(255,91,91,0.15); color: var(--red); }
  .verdict-badge.mixed { background: rgba(255,184,79,0.15); color: var(--amber); }
  .game-card.is-live { border-color: rgba(255,91,91,0.4); }
  .cheer-line {
    cursor: pointer; user-select: none; border-radius: 6px; padding: 4px 6px; margin: 1px -6px;
    transition: background 0.15s;
  }
  .cheer-line:hover { background: rgba(255,255,255,0.04); }
  .cheer-line.scored { background: rgba(52,199,89,0.14); }
  .cheer-line .check {
    display: inline-block; width: 14px; text-align: center; color: var(--green); font-weight: 700;
  }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  if (week < 1) week = 1;
  if (week > 18) week = 18;

function slug(s) {
  return (s || '').toString().toLowerCase().replace(/[^a-z0-9]+/g, '-');
}

function computeGameData(week) {
  var weekGames = SCHEDULE_ALL.filter(function(g) { return g.w === week; });
  var teamToGame = {};
  weekGames.forEach(function(g, idx) {
    teamToGame[g.h] = idx;
    teamToGame[g.a] = idx;
  });

  var gameBuckets = weekGames.map(function() { return { forMap: {}, againstMap: {} }; });
  var unmatched = { forMap: {}, againstMap: {} };

  function addToBucket(side, p, leagueName) {
    var idx = teamToGame[p.team];
    var mapKey = side === 'for' ? 'forMap' : 'againstMap';
    var bucket = idx !== undefined ? gameBuckets[idx] : unmatched;
    var key = (p.team || '') + '|' + p.name.toLowerCase();
    var map = bucket[mapKey];
    if (!map[key]) {
      map[key] = {
        name: p.name, pos: p.pos, team: p.team, leagues: [],
        uid: 'sc-' + side + '-' + slug(p.team) + '-' + slug(p.name)
      };
    }
    if (map[key].leagues.indexOf(leagueName) === -1) map[key].leagues.push(leagueName);
  }

  leagues.forEach(function(l) {
    l.myPlayers.forEach(function(p) { addToBucket('for', p, l.name); });
    l.oppPlayers.forEach(function(p) { addToBucket('against', p, l.name); });
  });

  function mapToList(map) {
    return Object.keys(map).map(function(k) { return map[k]; });
  }

  return {
    weekGames: weekGames,
    gameBuckets: gameBuckets.map(function(b) {
      return { forList: mapToList(b.forMap), againstList: mapToList(b.againstMap) };
    }),
    unmatched: { forList: mapToList(unmatched.forMap), againstList: mapToList(unmatched.againstMap) }
  };
}

function snapshotCheerLineHtml(p) {

  var leagueLabel = p.leagues.join(', ');
  return '<div class="cheer-line">' + esc(p.name) + (p.pos ? ' (' + esc(p.pos) + ')' : '') + esc(countTag) + '<br><span class="league-tag">' + esc(leagueLabel) + '</span></div>';
}

function snapshotGameCardHtml(title, timeLabel, bucket, liveState) {
  var badge = '';
  if (liveState === 'live') badge = '<span class="live-badge"><span class="live-dot"></span>LIVE</span>';
  else if (liveState === 'final') badge = '<span class="final-badge">FINAL</span>';

  var verdict = '';
  if (bucket.forList.length && !bucket.againstList.length) verdict = '<span class="verdict-badge win">All good</span>';
  else if (bucket.againstList.length && !bucket.forList.length) verdict = '<span class="verdict-badge lose">Rough one</span>';
  else if (bucket.forList.length && bucket.againstList.length) verdict = '<span class="verdict-badge mixed">Mixed bag</span>';

  return [
    '<div class="card">',
    '<div class="game-title">' + esc(title) + badge + verdict + '</div>',
    '<div class="game-time">' + esc(timeLabel) + '</div>',
    '<div class="game-cols">',
    '<div class="game-col"><div class="game-col-label for">You have</div>',
    bucket.forList.length ? bucket.forList.map(snapshotCheerLineHtml).join('') : '<div class="empty">Nobody</div>',
    '</div>',
    '<div class="game-col"><div class="game-col-label against">They have</div>',
    bucket.againstList.length ? bucket.againstList.map(snapshotCheerLineHtml).join('') : '<div class="empty">Nobody</div>',
    '</div>',
    '</div></div>'
  ].join('');
}

function buildSnapshotContent(week) {
  var data = computeGameData(week);
  var now = new Date();
  var stamp = now.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  var totalFor = 0, totalAgainst = 0, gamesInPlay = 0, liveNow = 0;
  var cardsHtml = '';
  data.weekGames.forEach(function(g, idx) {
    var b = data.gameBuckets[idx];
    if (!b.forList.length && !b.againstList.length) return;
    var state = gameLiveState(g);
    gamesInPlay++;
    if (state === 'live') liveNow++;
    totalFor += b.forList.length;
    totalAgainst += b.againstList.length;
    cardsHtml += snapshotGameCardHtml(g.a + ' @ ' + g.h, g.d, b, state);
  });
  if (data.unmatched.forList.length || data.unmatched.againstList.length) {
    cardsHtml += snapshotGameCardHtml('Unmatched team codes', 'Double check these team abbreviations', data.unmatched, 'none');
  }
  if (!cardsHtml) cardsHtml = '<div class="empty">No starters entered for week ' + week + ' yet.</div>';

  var summaryHtml = [
    '<div class="summary-bar">',
    '<div class="summary-stat"><div class="num">' + gamesInPlay + '</div><div class="lbl">Games in play</div></div>',
    '<div class="summary-stat"><div class="num red">' + liveNow + '</div><div class="lbl">Live now</div></div>',
    '<div class="summary-stat"><div class="num green">' + totalFor + '</div><div class="lbl">Your starters</div></div>',
    '<div class="summary-stat"><div class="num red">' + totalAgainst + '</div><div class="lbl">Opponent starters</div></div>',
    '</div>'
  ].join('');

  return { stamp: stamp, summaryHtml: summaryHtml, cardsHtml: cardsHtml };
}

function exportSnapshotPDF() {
  var btn = document.getElementById('snapshot-btn');

  // Open the tab immediately, synchronously, inside the tap/click itself.
  // Mobile browsers only allow this while still inside a user gesture -
  // if we wait for html2canvas to finish first (it's async), the browser
  // treats the later window.open/download as unrequested and blocks it.
  // That's the root cause of downloads silently failing on phones.
  var win = window.open('', '_blank');
  if (!win) {
    showToast('Please allow pop-ups for this page, then try again');
    return;
  }
  win.document.write(
    '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">' +
    '<title>Building snapshot...</title></head><body style="margin:0;background:#0f1115;color:#e8eaed;' +
    'font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;display:flex;' +
    'align-items:center;justify-content:center;height:100vh;font-size:15px;">Building your snapshot&hellip;</body></html>'
  );

  if (typeof html2canvas === 'undefined') {
    win.document.body.textContent = 'Still loading. Close this tab and try again in a second.';
    return;
  }

  var week = selectedWeek;
  var content = buildSnapshotContent(week);
  if (btn) { btn.disabled = true; btn.textContent = 'Building snapshot...'; }

  var container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.style.width = '700px';
  container.style.background = '#0f1115';
  container.style.padding = '20px 16px 30px';
  container.style.boxSizing = 'border-box';
  container.innerHTML = '<h1>Week ' + week + ' matchups</h1>' +
    '<div class="sub">Snapshot taken ' + esc(content.stamp) + '. This is a point-in-time capture &mdash; scores and statuses will not update.</div>' +
    content.summaryHtml + content.cardsHtml;
  document.body.appendChild(container);

  html2canvas(container, { backgroundColor: '#0f1115', scale: 2 }).then(function(canvas) {
    document.body.removeChild(container);
    var imgData = canvas.toDataURL('image/png');
    var pageHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
      '<title>Week ' + week + ' matchups snapshot</title>' +
      '<style>body{margin:0;background:#0f1115;font-family:-apple-system,BlinkMacSystemFont,' +
      '"Segoe UI",Roboto,sans-serif;} .hint{color:#9aa0ab;font-size:13px;text-align:center;' +
      'padding:14px 16px;} img{display:block;width:100%;height:auto;}</style></head><body>' +
      '<div class="hint">Press and hold the image to save it to your device.</div>' +
      '<img src="' + imgData + '" alt="Week ' + week + ' matchups" />' +
      '</body></html>';
    win.document.open();
    win.document.write(pageHtml);
    win.document.close();
    showToast('Snapshot ready in new tab');
    if (btn) { btn.disabled = false; btn.textContent = 'Download matchup snapshot'; }
  }).catch(function(err) {
    if (container.parentNode) document.body.removeChild(container);
    console.error(err);
    try { win.document.body.textContent = 'Could not build the snapshot. Close this tab and try again.'; } catch (e2) {}
    showToast('Could not build snapshot');
    if (btn) { btn.disabled = false; btn.textContent = 'Download matchup snapshot'; }
  });
}

function addPlayer(leagueId, side, name, pos, team) {
  if (!name || !name.trim()) return;
  var l = leagues.filter(function(x) { return x.id === leagueId; })[0];
  if (!l) return;
  var target = side === 'mine' ? l.myPlayers : l.oppPlayers;
  target.push({ id: 'p' + uid(), name: name.trim(), pos: pos || '', team: normalizeTeam(team) });
  saveData();
  render();
}

function removePlayer(leagueId, side, playerId) {
  var l = leagues.filter(function(x) { return x.id === leagueId; })[0];
  if (!l) return;
  if (side === 'mine') l.myPlayers = l.myPlayers.filter(function(p) { return p.id !== playerId; });
  else l.oppPlayers = l.oppPlayers.filter(function(p) { return p.id !== playerId; });
  saveData();
  render();
}

function resetToBaseline(leagueId) {
  var l = leagues.filter(function(x) { return x.id === leagueId; })[0];
  if (!l) return;
  l.myPlayers = makeBaselineRoster(l.name);
  saveData();
  render();
}

function clearOpponent(leagueId) {
  var l = leagues.filter(function(x) { return x.id === leagueId; })[0];
  if (!l) return;
  l.oppPlayers = [];
  saveData();
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function buildWeekSelect() {
  var sel = document.getElementById('week-select');
  sel.innerHTML = '';
  for (var w = 1; w <= 18; w++) {
    var opt = document.createElement('option');
    opt.value = w;
    opt.textContent = 'Week ' + w;
    if (w === selectedWeek) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.onchange = function() { selectedWeek = parseInt(sel.value, 10); render(); };
}

function renderLeaguesTab() {
  var c = document.getElementById('content');
  c.innerHTML = leagues.map(function(l) { return leagueCardHtml(l); }).join('');
  c.innerHTML += '<div class="save-hint">This file doesn\u2019t save changes between visits &mdash; edits here last for this viewing only. Your starters default to your baseline roster each league; use "Reset to baseline" to snap back, and "Clear opponent" wipes just the opposing roster.</div>';

  leagues.forEach(function(l) {
    var resetBtn = document.getElementById('resetbase-' + l.id);
    if (resetBtn) resetBtn.onclick = function() {
      if (confirm('Reset ' + l.name + ' starters back to your baseline roster?')) resetToBaseline(l.id);
    };
    var clearOppBtn = document.getElementById('clearopp-' + l.id);
    if (clearOppBtn) clearOppBtn.onclick = function() {
      if (confirm('Clear opponent starters for ' + l.name + '?')) clearOpponent(l.id);
    };

    ['mine', 'opp'].forEach(function(side) {
      wireAutocomplete(l.id, side);
      var addBtn = document.getElementById('addp-' + side + '-' + l.id);
      if (addBtn) {
        addBtn.onclick = function() {
          var nameEl = document.getElementById('in-name-' + side + '-' + l.id);
          var posEl = document.getElementById('in-pos-' + side + '-' + l.id);
          var teamEl = document.getElementById('in-team-' + side + '-' + l.id);
          addPlayer(l.id, side, nameEl.value, posEl.value, teamEl.value);
        };
      }
    });

    l.myPlayers.forEach(function(p) {
      var x = document.getElementById('rm-mine-' + p.id);
      if (x) x.onclick = function() { removePlayer(l.id, 'mine', p.id); };
    });
    l.oppPlayers.forEach(function(p) {
      var x = document.getElementById('rm-opp-' + p.id);
      if (x) x.onclick = function() { removePlayer(l.id, 'opp', p.id); };
    });
  });
}

function leagueCardHtml(l) {
  return [
    '<div class="card">',
    '<div class="league-header"><span class="lname">' + esc(l.name) + '</span>',
    '<div class="header-btns"><button class="clear-btn" id="resetbase-' + l.id + '">Reset to baseline</button>',
    '<button class="clear-btn" id="clearopp-' + l.id + '">Clear opponent</button></div></div>',
    '<div class="section-label">Your starters (' + l.myPlayers.length + ')</div>',
    l.myPlayers.map(function(p) { return playerRowHtml(p, 'mine'); }).join('') || '<div class="empty">No starters added</div>',
    addRowHtml(l.id, 'mine'),
    '<div class="section-label">Opponent starters (' + l.oppPlayers.length + ')</div>',
    l.oppPlayers.map(function(p) { return playerRowHtml(p, 'opp'); }).join('') || '<div class="empty">No opponent added yet</div>',
    addRowHtml(l.id, 'opp'),
    '</div>'
  ].join('');
}

function playerRowHtml(p, side) {
  var badge = side === 'mine' ? '<span class="badge for">FOR</span>' : '<span class="badge against">AGAINST</span>';
  return [
    '<div class="player-row">', badge,
    '<span class="player-name">' + esc(p.name) + '</span>',
    '<span class="player-meta">' + esc(p.pos) + (p.pos && p.team ? ' &middot; ' : '') + esc(p.team) + '</span>',
    '<span class="rm-x" id="rm-' + side + '-' + p.id + '">Remove</span>',
    '</div>'
  ].join('');
}

function addRowHtml(leagueId, side) {
  return [
    '<div class="autocomplete-wrap">',
    '<input type="text" class="search-input" autocomplete="off" placeholder="Search player name or team D/ST" id="search-' + side + '-' + leagueId + '" />',
    '<div class="dropdown" id="dropdown-' + side + '-' + leagueId + '" style="display:none"></div>',
    '</div>',
    '<span class="manual-toggle" id="manual-toggle-' + side + '-' + leagueId + '">Can\u2019t find them? Add manually</span>',
    '<div class="add-row" id="manual-row-' + side + '-' + leagueId + '" style="display:none">',
    '<input class="name" type="text" placeholder="Player name" id="in-name-' + side + '-' + leagueId + '" />',
    '<select id="in-pos-' + side + '-' + leagueId + '">',
    '<option value="">Pos</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option>',
    '</select>',
    '<input class="team" type="text" placeholder="Tm" maxlength="4" id="in-team-' + side + '-' + leagueId + '" />',
    '<button id="addp-' + side + '-' + leagueId + '">Add</button>',
    '</div>'
  ].join('');
}

function searchPlayers(q) {
  q = q.toLowerCase().trim();
  if (!q) return [];
  var starts = [];
  var contains = [];
  PLAYERS.forEach(function(p) {
    var n = p.n.toLowerCase();
    if (n.indexOf(q) === 0 || p.t.toLowerCase() === q) starts.push(p);
    else if (n.indexOf(q) !== -1) contains.push(p);
  });
  return starts.concat(contains).slice(0, 8);
}

function wireAutocomplete(leagueId, side) {
  var input = document.getElementById('search-' + side + '-' + leagueId);
  var dropdown = document.getElementById('dropdown-' + side + '-' + leagueId);
  if (!input || !dropdown) return;

  function showResults() {
    var results = searchPlayers(input.value);
    if (!results.length) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; return; }
    dropdown.innerHTML = results.map(function(p, i) {
      return '<div class="dropdown-item" data-idx="' + i + '"><span>' + esc(p.n) + '</span><span class="meta">' + esc(p.p) + ' &middot; ' + esc(p.t) + '</span></div>';
    }).join('');
    dropdown.style.display = 'block';
    var items = dropdown.querySelectorAll('.dropdown-item');
    items.forEach(function(item, i) {
      item.onmousedown = function(e) {
        e.preventDefault();
        var p = results[i];
        addPlayer(leagueId, side, p.n, p.p, p.t);
      };
    });
  }

  input.oninput = showResults;
  input.onfocus = showResults;
  input.onblur = function() { setTimeout(function() { dropdown.style.display = 'none'; }, 150); };
  input.onkeydown = function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var results = searchPlayers(input.value);
      if (results.length) addPlayer(leagueId, side, results[0].n, results[0].p, results[0].t);
    }
  };

  var manualToggle = document.getElementById('manual-toggle-' + side + '-' + leagueId);
  var manualRow = document.getElementById('manual-row-' + side + '-' + leagueId);
  if (manualToggle && manualRow) {
    manualToggle.onclick = function() {
      var showing = manualRow.style.display !== 'none';
      manualRow.style.display = showing ? 'none' : 'flex';
      manualToggle.textContent = showing ? 'Can\u2019t find them? Add manually' : 'Hide manual entry';
    };
  }
}

function gameLiveState(g) {
  var start = new Date(g.t);
  var now = new Date();
  var end = new Date(start.getTime() + 3.5 * 3600000);
  if (now < start) return 'upcoming';
  if (now >= start && now <= end) return 'live';
  return 'final';
}

function renderGamesTab() {
  var c = document.getElementById('content');
  var data = computeGameData(selectedWeek);
  var weekGames = data.weekGames;
  var gameBuckets = data.gameBuckets;
  var unmatched = data.unmatched;

  var anyGamePlayers = gameBuckets.some(function(b) { return b.forList.length || b.againstList.length; });
  var anyUnmatched = unmatched.forList.length || unmatched.againstList.length;

  if (!anyGamePlayers && !anyUnmatched) {
    c.innerHTML = '<div class="empty big">Add starters in the My starters tab for week ' + selectedWeek + ' and they will show up here grouped by NFL matchup.</div>';
    return;
  }

  var totalFor = 0, totalAgainst = 0, gamesInPlay = 0, liveNow = 0;
  gameBuckets.forEach(function(b, idx) {
    if (gameLiveState(weekGames[idx]) === 'final') return;
    if (b.forList.length || b.againstList.length) {
      gamesInPlay++;
      if (gameLiveState(weekGames[idx]) === 'live') liveNow++;
    }
    totalFor += b.forList.length;
    totalAgainst += b.againstList.length;
  });

  var toolbar = [
    '<div class="games-toolbar">',
    '<button class="filter-btn' + (gameFilter === 'all' ? ' active' : '') + '" id="filter-all">All games</button>',
    '<button class="filter-btn' + (gameFilter === 'mine' ? ' active' : '') + '" id="filter-mine">My games only</button>',
    '</div>'
  ].join('');

  var summary = [
    '<div class="summary-bar">',
    '<div class="summary-stat"><div class="num">' + gamesInPlay + '</div><div class="lbl">Games in play</div></div>',
    '<div class="summary-stat"><div class="num red">' + liveNow + '</div><div class="lbl">Live now</div></div>',
    '<div class="summary-stat"><div class="num green">' + totalFor + '</div><div class="lbl">Your starters</div></div>',
    '<div class="summary-stat"><div class="num red">' + totalAgainst + '</div><div class="lbl">Opponent starters</div></div>',
    '</div>'
  ].join('');

  var html = '';
  var hadFinals = false;
  weekGames.forEach(function(g, idx) {
    var b = gameBuckets[idx];
    if (!b.forList.length && !b.againstList.length) return;
    if (gameFilter === 'mine' && !b.forList.length) return;
    if (gameLiveState(g) === 'final') { hadFinals = true; return; }
    html += gameCardHtml(g.a + ' @ ' + g.h, g.d, b, gameLiveState(g));
  });
  if (anyUnmatched && gameFilter === 'all') {
    html += gameCardHtml('Unmatched team codes', 'Double check these team abbreviations', unmatched, 'none');
  }
  if (!html) html = '<div class="empty big">' + (hadFinals ? 'All your games for week ' + selectedWeek + ' have gone final.' : 'No games with your own starters this week yet.') + '</div>';

  c.innerHTML = toolbar + summary + html;

  var filterAllBtn = document.getElementById('filter-all');
  var filterMineBtn = document.getElementById('filter-mine');
  if (filterAllBtn) filterAllBtn.onclick = function() { gameFilter = 'all'; render(); };
  if (filterMineBtn) filterMineBtn.onclick = function() { gameFilter = 'mine'; render(); };

  [].concat.apply([], gameBuckets.map(function(b) { return b.forList.concat(b.againstList); }))
    .concat(unmatched.forList, unmatched.againstList)
    .forEach(function(p) {
      var el = document.getElementById(p.uid);
      if (el) el.onclick = function() { toggleScored(p.uid); };
    });
}

function toggleScored(uid) {
  scoredPlayers[uid] = !scoredPlayers[uid];
  render();
}

function gameCardHtml(title, timeLabel, bucket, liveState) {
  var badge = '';
  if (liveState === 'live') badge = '<span class="live-badge"><span class="live-dot"></span>LIVE</span>';
  else if (liveState === 'final') badge = '<span class="final-badge">FINAL</span>';

  var verdict = '';
  if (bucket.forList.length && !bucket.againstList.length) verdict = '<span class="verdict-badge win">All good</span>';
  else if (bucket.againstList.length && !bucket.forList.length) verdict = '<span class="verdict-badge lose">Rough one</span>';
  else if (bucket.forList.length && bucket.againstList.length) verdict = '<span class="verdict-badge mixed">Mixed bag</span>';

  return [
    '<div class="card game-card' + (liveState === 'live' ? ' is-live' : '') + '">',
    '<div class="game-title">' + esc(title) + badge + verdict + '</div>',
    '<div class="game-time">' + esc(timeLabel) + '</div>',
    '<div class="game-cols">',
    '<div class="game-col"><div class="game-col-label for">You have</div>',
    bucket.forList.length ? bucket.forList.map(cheerLineHtml).join('') : '<div class="empty">Nobody</div>',
    '</div>',
    '<div class="game-col"><div class="game-col-label against">They have</div>',
    bucket.againstList.length ? bucket.againstList.map(cheerLineHtml).join('') : '<div class="empty">Nobody</div>',
    '</div>',
    '</div></div>'
  ].join('');
}

function cheerLineHtml(p) {
  var scored = !!scoredPlayers[p.uid];
  var countTag = p.leagues.length > 1 ? ' (' + p.leagues.length + 'x)' : '';
  var leagueLabel = p.leagues.join(', ');
  return [
    '<div class="cheer-line' + (scored ? ' scored' : '') + '" id="' + p.uid + '">',
    '<span class="check">' + (scored ? '\u2713' : '') + '</span>',
    esc(p.name) + (p.pos ? ' (' + esc(p.pos) + ')' : '') + esc(countTag),
    '<br><span class="league-tag">' + esc(leagueLabel) + '</span>',
    '</div>'
  ].join('');
}

function render() {
  if (!loaded) {
    document.getElementById('content').innerHTML = '<div class="loading">Loading your leagues...</div>';
    return;
  }
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].getAttribute('data-tab') === activeTab) tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  document.getElementById('week-select').style.display = activeTab === 'games' ? 'inline-block' : 'none';
  if (activeTab === 'leagues') renderLeaguesTab();
  else renderGamesTab();
}

var tabEls = document.querySelectorAll('.tab');
for (var i = 0; i < tabEls.length; i++) {
  tabEls[i].onclick = (function(el) {
    return function() { activeTab = el.getAttribute('data-tab'); render(); };
  })(tabEls[i]);
}

document.getElementById('snapshot-btn').onclick = exportSnapshotPDF;

loadData();
</script>
</body>
</html>
