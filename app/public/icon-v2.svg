<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d2a45"/>
      <stop offset="0.55" stop-color="#0f1626"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7affd8"/>
      <stop offset="1" stop-color="#16c795"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a9a"/>
      <stop offset="1" stop-color="#ef3f5a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.09"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="ball">
      <path d="M72 256 C 140 128, 372 128, 440 256 C 372 384, 140 384, 72 256 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- yard lines in perspective -->
  <g stroke="url(#field)" stroke-width="5">
    <path d="M256 512 L256 300"/>
    <path d="M150 512 L206 300"/><path d="M362 512 L306 300"/>
    <path d="M40 512 L156 300"/><path d="M472 512 L356 300"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <path d="M0 360 H512"/><path d="M0 420 H512"/><path d="M0 482 H512"/>
  </g>

  <g transform="rotate(-38 256 256) translate(256 250) scale(1.06) translate(-256 -256)">
    <!-- glow -->
    <ellipse cx="220" cy="256" rx="140" ry="90" fill="#2fe0b0" opacity="0.6" filter="url(#glow)"/>
    <ellipse cx="300" cy="256" rx="140" ry="90" fill="#ff5c72" opacity="0.55" filter="url(#glow)"/>
    <!-- ball: mint half / coral half -->
    <g clip-path="url(#ball)">
      <rect x="60" y="140" width="196" height="240" fill="url(#mint)"/>
      <rect x="256" y="140" width="200" height="240" fill="url(#coral)"/>
      <rect x="251" y="140" width="10" height="240" fill="#0b101b"/>
      <ellipse cx="236" cy="198" rx="130" ry="24" fill="#ffffff" opacity="0.22"/>
      <!-- stripes near the tips -->
      <path d="M140 150 Q122 256 140 362" stroke="#0b101b" stroke-width="13" fill="none"/>
      <path d="M372 150 Q390 256 372 362" stroke="#0b101b" stroke-width="13" fill="none"/>
    </g>
    <path d="M72 256 C 140 128, 372 128, 440 256 C 372 384, 140 384, 72 256 Z" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    <!-- laces -->
    <path d="M196 256 H316" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
      <path d="M212 238 v36"/><path d="M236 238 v36"/><path d="M276 238 v36"/><path d="M300 238 v36"/>
    </g>
  </g>
</svg>
